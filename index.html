<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Prova de Bolsas 2027 · Escola Estrela Guia</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:32px;color:#15335c">
<p id="msg">Carregando a prova…</p>
<script>
(function(){
  var URL_PAGINA = 'https://cesaraguiar.app.n8n.cloud/webhook/prova-bolsa-3em-pagina';
  var BASE = 'https://cesaraguiar.app.n8n.cloud/webhook/prova-bolsa-3em';
  function erro(){
    document.getElementById('msg').innerHTML = 'Não foi possível carregar a prova. Verifique a internet e toque em <button onclick="location.reload()">Recarregar</button>';
  }
  var tent = 0;
  function carregar(){
    fetch(URL_PAGINA, {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); }).then(function(h){
      h = h.replace(/var BASE = [^;]+;/, "var BASE = '" + BASE + "';");
      document.open(); document.write(h); document.close();
    }).catch(function(){ tent++; if(tent < 3) setTimeout(carregar, 1500); else erro(); });
  }
  carregar();
})();
</script>
</body>
</html>
